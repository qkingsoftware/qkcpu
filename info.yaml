# Tiny Tapeout project information
project:
  title:        "QKCPU"
  author:       "QKing"
  discord:      ""
  description:  "8-bit CPU with Dual 128x8 GF180 SRAM (Program and Data RAM)"
  language:     "Verilog"
  clock_hz:     20000000

  # Two 128x8 SRAM macros (431.86 x 268.88 um each) placed side by side.
  tiles: "3x4"

  top_module: "QKCPU"

  source_files:
    - "project.v"
    - "cpu_core.v"
    - "control_unit.v"
    - "inst_decoder.v"
    - "register_bank.v"
    - "pgrm_counter.v"
    - "alu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Loader addr 0"
  ui[1]: "Loader addr 1"
  ui[2]: "Loader addr 2"
  ui[3]: "Loader addr 3"
  ui[4]: "Loader addr 4 / Reg sel 0"
  ui[5]: "Loader addr 5 / Reg sel 1"
  ui[6]: "Loader addr 6"
  ui[7]: "Program load mode (1=Load, 0=Run)"

  # Outputs
  uo[0]: "Reg view bit 0"
  uo[1]: "Reg view bit 1"
  uo[2]: "Reg view bit 2"
  uo[3]: "Reg view bit 3"
  uo[4]: "Reg view bit 4"
  uo[5]: "Reg view bit 5"
  uo[6]: "Reg view bit 6"
  uo[7]: "Reg view bit 7"

  # Bidirectional pins
  uio[0]: "Loader data 0 / CPU out 0"
  uio[1]: "Loader data 1 / CPU out 1"
  uio[2]: "Loader data 2 / CPU out 2"
  uio[3]: "Loader data 3 / CPU out 3"
  uio[4]: "Loader data 4 / CPU out 4"
  uio[5]: "Loader data 5 / CPU out 5"
  uio[6]: "Loader data 6 / CPU out 6"
  uio[7]: "Loader data 7 / CPU out 7"

# Do not change!
yaml_version: 6
