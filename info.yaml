# Tiny Tapeout project information
project:
  title:        "QKCPU"
  author:       "QKing"
  discord:      ""
  description:  "8-bit CPU with custom ISA, separate data and program RAM, and per-pin GPIO/PWM."
  language:     "Verilog"
  clock_hz:     25000000 #25mhz

  # Two 128x8 SRAM macros (431.86 x 268.88 um each) placed side by side.
  tiles: "3x4"

  top_module: "tt_um_QKCPU"

  source_files:
    - "project.v"
    - "cpu_core.v"
    - "control_unit.v"
    - "inst_decoder.v"
    - "register_bank.v"
    - "pgrm_counter.v"
    - "alu.v"
    - "gpio_pwm.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Loader addr 0 / CPU in 0"
  ui[1]: "Loader addr 1 / CPU in 1"
  ui[2]: "Loader addr 2 / CPU in 2"
  ui[3]: "Loader addr 3 / CPU in 3"
  ui[4]: "Loader addr 4 / Reg sel 0 / CPU in 4"
  ui[5]: "Loader addr 5 / Reg sel 1 / CPU in 5"
  ui[6]: "Loader addr 6 / CPU in 6"
  ui[7]: "Program load mode (1=Load, 0=Run)"

  # Outputs
  uo[0]: "CPU out 0 (Reg view when halted)"
  uo[1]: "CPU out 1 (Reg view when halted)"
  uo[2]: "CPU out 2 (Reg view when halted)"
  uo[3]: "CPU out 3 (Reg view when halted)"
  uo[4]: "CPU out 4 (Reg view when halted)"
  uo[5]: "CPU out 5 (Reg view when halted)"
  uo[6]: "CPU out 6 (Reg view when halted)"
  uo[7]: "CPU out 7 (Reg view when halted)"

  # Bidirectional pins
  uio[0]: "Loader data 0 / GPIO-PWM 0"
  uio[1]: "Loader data 1 / GPIO-PWM 1"
  uio[2]: "Loader data 2 / GPIO-PWM 2"
  uio[3]: "Loader data 3 / GPIO-PWM 3"
  uio[4]: "Loader data 4 / GPIO-PWM 4"
  uio[5]: "Loader data 5 / GPIO-PWM 5"
  uio[6]: "Loader data 6 / GPIO-PWM 6"
  uio[7]: "Loader data 7 / GPIO-PWM 7"

# Do not change!
yaml_version: 6